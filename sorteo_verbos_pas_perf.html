<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorteo de Verbos en Quechua</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.75);
            --quechua-color: #ef4444; /* Rojo vibrante */
            --spanish-color: #38bdf8;  /* Celeste / Azul claro */
            --text-muted: #94a3b8;
            --suffix-color: #a855f7;  /* Morado para 'rqa' */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at 50% 30%, #1e293b 0%, #0f172a 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-top: 15px;
        }

        h1 {
            font-size: 2.2rem;
            color: #f8fafc;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 1rem;
        }

        /* Contenedor Principal / Tarjeta */
        main {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 650px;
            margin: auto 0;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 60px 30px;
            width: 100%;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            position: relative;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 5px;
            background: linear-gradient(90deg, var(--quechua-color), var(--spanish-color));
            border-radius: 24px 24px 0 0;
        }

        /* Área interactiva del verbo Quechua */
        .quechua-wrapper {
            position: relative;
            display: inline-block;
            cursor: pointer;
        }

        .quechua-word {
            font-size: 3.8rem;
            font-weight: 800;
            color: var(--quechua-color);
            text-shadow: 0 4px 20px rgba(239, 68, 68, 0.35);
            margin-bottom: 20px;
            min-height: 90px;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1.1;
            word-break: break-word;
            transition: transform 0.2s ease;
        }

        .quechua-wrapper:hover .quechua-word {
            transform: scale(1.03);
        }

        .hover-hint {
            font-size: 0.85rem;
            color: var(--spanish-color);
            margin-top: -15px;
            margin-bottom: 20px;
            opacity: 0.8;
            font-style: italic;
        }

        /* Tooltip de Conjugaciones Centrado en Pantalla */
        .conjugation-tooltip {
            visibility: hidden;
            opacity: 0;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -45%) scale(0.95);
            width: 90%;
            max-width: 450px;
            background: #1e293b;
            border: 2px solid #334155;
            border-radius: 16px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.85), 0 0 0 100vmax rgba(15, 23, 42, 0.6);
            z-index: 1000;
            transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none;
            overflow: hidden;
            text-align: left;
        }

        .quechua-wrapper:hover .conjugation-tooltip {
            visibility: visible;
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        /* Estructura de la Tabla de Conjugación */
        .tooltip-header {
            background-color: #84cc16; /* Verde de la imagen */
            color: #0f172a;
            font-weight: 800;
            text-align: center;
            padding: 10px;
            font-size: 1rem;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .conj-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 1rem;
        }

        .conj-table tr {
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .conj-table tr:nth-child(even) {
            background-color: rgba(255, 255, 255, 0.03);
        }

        .conj-table td {
            padding: 8px 16px;
        }

        .conj-q {
            color: #ffffff;
            font-weight: 600;
            width: 55%;
        }

        .conj-e {
            color: #ef4444; /* Texto en rojo */
            font-weight: 700;
            width: 45%;
        }

        .rqa {
            color: var(--suffix-color);
            font-weight: bold;
        }

        .term {
            color: #ef4444;
            font-weight: bold;
        }

        /* Texto en Español */
        .spanish-word {
            font-size: 2.1rem;
            font-weight: 600;
            color: var(--spanish-color);
            text-shadow: 0 2px 10px rgba(56, 189, 248, 0.25);
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0.95;
            word-break: break-word;
        }

        /* Animación al sortear */
        .fade-in {
            animation: popIn 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes popIn {
            0% {
                opacity: 0;
                transform: scale(0.85) translateY(12px);
            }
            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        /* Controles y Botones */
        .controls {
            margin-top: 30px;
            display: flex;
            gap: 15px;
            width: 100%;
            justify-content: center;
            flex-wrap: wrap;
        }

        button {
            background-color: var(--quechua-color);
            color: white;
            border: none;
            padding: 16px 36px;
            font-size: 1.15rem;
            font-weight: 700;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 25px -5px rgba(239, 68, 68, 0.4);
            transition: all 0.2s ease;
            outline: none;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 28px -5px rgba(239, 68, 68, 0.5);
            background-color: #dc2626;
        }

        button:active {
            transform: translateY(1px);
        }

        button.reset-btn {
            background-color: transparent;
            border: 2px solid var(--text-muted);
            color: var(--text-muted);
            box-shadow: none;
            padding: 16px 28px;
        }

        button.reset-btn:hover {
            border-color: #ffffff;
            color: #ffffff;
            background-color: rgba(255, 255, 255, 0.05);
            box-shadow: none;
        }

        button:disabled {
            background-color: #475569;
            color: #94a3b8;
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
        }

        .status-info {
            margin-top: 20px;
            font-size: 0.95rem;
            color: var(--text-muted);
            background: rgba(15, 23, 42, 0.6);
            padding: 8px 20px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        footer {
            margin-top: 30px;
            color: var(--text-muted);
            font-size: 0.9rem;
            text-align: center;
        }

        @media (max-width: 500px) {
            .quechua-word { font-size: 2.6rem; }
            .spanish-word { font-size: 1.5rem; }
            .card { padding: 40px 15px; }
            button { padding: 14px 28px; font-size: 1rem; width: 100%; }
            .controls { flex-direction: column; width: 100%; }
            .conj-table { font-size: 0.85rem; }
            .conj-table td { padding: 6px 10px; }
        }
    </style>
</head>
<body>

    <header>
        <h1>Conjugación de Verbos</h1>
        <p class="subtitle">Sorteador interactivo de verbos en Quechua</p>
    </header>

    <main>
        <div class="card">
            <div class="quechua-wrapper" id="quechua-wrapper">
                <div id="quechua-container" class="quechua-word">¡Sortea un verbo!</div>
                <div class="hover-hint" id="hint-text">(Pasa el mouse para ver conjugación)</div>
                
                <!-- Cuadro de Conjugación Flotante (Centrado en pantalla) -->
                <div class="conjugation-tooltip" id="tooltip">
                    <div class="tooltip-header">PASADO PERFECTO</div>
                    <table class="conj-table" id="conj-body">
                        <!-- Generado dinámicamente -->
                    </table>
                </div>
            </div>

            <div id="spanish-container" class="spanish-word">Haz clic en el botón de abajo</div>
        </div>

        <div class="controls">
            <button id="draw-btn" onclick="sortearVerbo()">Sortear Verbo</button>
            <button id="reset-btn" class="reset-btn" onclick="reiniciarSorteo()">Reiniciar Mazo</button>
        </div>

        <div id="status" class="status-info">
            Verbos disponibles: <span id="count">0</span>
        </div>
    </main>

        function inicializar() {
            verbosDisponibles = [...verbosOriginales];

        function actualizarContador() {
            countEl.textContent = `${verbosDisponibles.length} de ${verbosOriginales.length}`;
        }

        function obtenerRaiz(verboQuechua) {
            let limpia = verboQuechua.split(',')[0].trim();
            if (limpia.toLowerCase().endsWith('y')) {
                return limpia.slice(0, -1);
            }
            return limpia;
        }

        function obtenerVerboEspañolSimple(espanol) {
            return espanol.split('/')[0].split(',')[0].trim().toLowerCase();
        }

        function conjugarEspanolPasado(verboEspañol) {
            let v = verboEspañol.trim().toLowerCase();
            
            if (v === "comer") return ["comí", "comiste", "comió", "comimos", "comimos", "comieron", "comieron"];
            if (v === "moler") return ["molí", "moliste", "molió", "molimos", "molimos", "molieron", "molieron"];
            if (v === "hablar") return ["hablé", "hablaste", "habló", "hablamos", "hablamos", "hablaron", "hablaron"];
            if (v === "trabajar") return ["trabajé", "trabajaste", "trabajó", "trabajamos", "trabajamos", "trabajaron", "trabajaron"];
            if (v === "ir") return ["fui", "fuiste", "fue", "fuimos", "fuimos", "fueron", "fueron"];
            if (v === "hacer") return ["hice", "hiciste", "hizo", "hicimos", "hicimos", "hicieron", "hicieron"];
            if (v === "ver") return ["vi", "viste", "vio", "vimos", "vimos", "vieron", "vieron"];

            if (v.endsWith("ar")) {
                let raiz = v.slice(0, -2);
                return [raiz + "é", raiz + "aste", raiz + "ó", raiz + "amos", raiz + "amos", raiz + "aron", raiz + "aron"];
            } else if (v.endsWith("er") || v.endsWith("ir")) {
                let raiz = v.slice(0, -2);
                return [raiz + "í", raiz + "iste", raiz + "ió", raiz + "imos", raiz + "imos", raiz + "ieron", raiz + "ieron"];
            } else if (v.endsWith("se")) {
                let raizBase = v.slice(0, -2);
                let conj = conjugarEspanolPasado(raizBase);
                return conj.map((c, idx) => {
                    let pronombre = ["me", "te", "se", "nos", "nos", "se", "se"][idx];
                    return `${pronombre} ${c}`;
                });
            }

            return ["acción pasada", "acción pasada", "acción pasada", "acción pasada", "acción pasada", "acción pasada", "acción pasada"];
        }

        function generarTablaConjugacion(verboQ, verboE) {
            const raiz = obtenerRaiz(verboQ);
            const vEspañol = obtenerVerboEspañolSimple(verboE);
            const conjEsp = conjugarEspanolPasado(vEspañol);

            const pronombres = [
                { pQ: "Ñuqa", suf: "ni", pE: "Yo", cE: conjEsp[0] },
                { pQ: "Qam", suf: "nki", pE: "Tú", cE: conjEsp[1] },
                { pQ: "Pay", suf: "", pE: "Él/Ella", cE: conjEsp[2] },
                { pQ: "Ñuqanchik", suf: "nchik", pE: "Nosotros (incl)", cE: conjEsp[3] },
                { pQ: "Ñuqayku", suf: "yku", pE: "Nosotros (excl)", cE: conjEsp[4] },
                { pQ: "Qamkuna", suf: "nkichik", pE: "Ustedes", cE: conjEsp[5] },
                { pQ: "Paykuna", suf: "nku", pE: "Ellos/Ellas", cE: conjEsp[6] }
            ];

            let html = "";
            pronombres.forEach(item => {
                html += `
                    <tr>
                        <td class="conj-q">
                            ${item.pQ} ${raiz}<span class="rqa">rqa</span><span class="term">${item.suf}</span>
                        </td>
                        <td class="conj-e">
                            ${item.pE} ${item.cE}
                        </td>
                    </tr>
                `;
            });

            conjBodyEl.innerHTML = html;
        }

        function sortearVerbo() {
            if (verbosDisponibles.length === 0) return;

            const randomIndex = Math.floor(Math.random() * verbosDisponibles.length);
            const verboSorteado = verbosDisponibles.splice(randomIndex, 1)[0];

            quechuaEl.classList.remove("fade-in");
            spanishEl.classList.remove("fade-in");
            void quechuaEl.offsetWidth; 

            quechuaEl.textContent = verboSorteado.q;
            spanishEl.textContent = verboSorteado.e;

            generarTablaConjugacion(verboSorteado.q, verboSorteado.e);
            hintTextEl.style.display = "block";

            quechuaEl.classList.add("fade-in");
            spanishEl.classList.add("fade-in");

            actualizarContador();

            if (verbosDisponibles.length === 0) {
                drawBtn.disabled = true;
                drawBtn.textContent = "¡Mazo Completado!";
            }
        }

        function reiniciarSorteo() {
            verbosDisponibles = [...verbosOriginales];

            spanishEl.textContent = "Presiona 'Sortear Verbo' para empezar";
