<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unir Archivos PDF</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
  <script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center p-6">

  <div class="max-w-2xl w-full bg-slate-800 rounded-2xl shadow-2xl border border-slate-700 p-8 space-y-6">
    <header class="text-center space-y-2">
      <h1 class="text-3xl font-bold text-indigo-400">PDF Combiner Pro</h1>
      <p class="text-slate-400 text-sm">Arrastra tus archivos, ordénalos a tu gusto y descarga el resultado.</p>
    </header>

    <div id="drop-zone" class="border-2 border-dashed border-indigo-500/50 hover:border-indigo-400 rounded-xl p-8 text-center cursor-pointer bg-slate-800/50 hover:bg-slate-700/30 transition duration-200">
      <svg class="mx-auto h-12 w-12 text-indigo-400 mb-3" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/>
      </svg>
      <p class="text-slate-300 font-medium">Arrastra tus PDFs aquí o <span class="text-indigo-400 underline">haz clic para buscar</span></p>
      <input type="file" id="file-input" multiple accept="application/pdf" class="hidden">
    </div>

    <div>
      <h2 class="text-sm font-semibold text-slate-400 uppercase tracking-wider mb-3">Archivos a unir (arrastra para reordenar)</h2>
      <ul id="file-list" class="space-y-2 min-h-[50px]"></ul>
    </div>

    <button id="merge-btn" disabled class="w-full py-3.5 px-6 rounded-xl font-semibold text-white bg-indigo-600 hover:bg-indigo-500 disabled:bg-slate-700 disabled:text-slate-500 disabled:cursor-not-allowed transition duration-200 shadow-lg shadow-indigo-600/30 flex items-center justify-center space-x-2">
      <span id="btn-text">Unir y Descargar PDF</span>
    </button>
  </div>

  <script>
    const fileInput = document.getElementById('file-input');
    const dropZone = document.getElementById('drop-zone');
    const fileListEl = document.getElementById('file-list');
    const mergeBtn = document.getElementById('merge-btn');
    const btnText = document.getElementById('btn-text');

    let pdfFiles = [];

    // Inicializar SortableJS para reordenar la lista arrastrando
    const sortable = new Sortable(fileListEl, {
      animation: 150,
      ghostClass: 'bg-indigo-950/40',
      onEnd: () => {
        // Actualizar el array interno según el nuevo orden visual
        const newOrder = Array.from(fileListEl.children).map(li => li.dataset.id);
        pdfFiles.sort((a, b) => newOrder.indexOf(a.id) - newOrder.indexOf(b.id));
      }
    });

    // Eventos de selección de archivos
    dropZone.addEventListener('click', () => fileInput.click());
    
    fileInput.addEventListener('change', (e) => {
      addFiles(Array.from(e.target.files));
      fileInput.value = '';
    });

    dropZone.addEventListener('dragover', (e) => {
      e.preventDefault();
      dropZone.classList.add('border-indigo-400', 'bg-slate-700/50');
    });

    dropZone.addEventListener('dragleave', () => {
      dropZone.classList.remove('border-indigo-400', 'bg-slate-700/50');
    });

    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.classList.remove('border-indigo-400', 'bg-slate-700/50');
      const files = Array.from(e.dataTransfer.files).filter(f => f.type === 'application/pdf');
      addFiles(files);
    });

    function addFiles(files) {
      files.forEach(file => {
        const fileObj = {
          id: Math.random().toString(36).substr(2, 9),
          file: file
        };
        pdfFiles.push(fileObj);
      });
      renderList();
    }

    function removeFile(id) {
      pdfFiles = pdfFiles.filter(item => item.id !== id);
      renderList();
    }

    function renderList() {
      fileListEl.innerHTML = '';
      
      pdfFiles.forEach((item) => {
        const li = document.createElement('li');
        li.dataset.id = item.id;
        li.className = 'flex items-center justify-between p-3 bg-slate-700/50 border border-slate-600 rounded-lg cursor-grab active:cursor-grabbing hover:border-slate-500 transition duration-150';
        
        li.innerHTML = `
          <div class="flex items-center space-x-3 overflow-hidden">
            <svg class="h-5 w-5 text-indigo-400 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
            </svg>
            <span class="text-sm font-medium text-slate-200 truncate">${item.file.name}</span>
            <span class="text-xs text-slate-400">(${(item.file.size / 1024 / 1024).toFixed(2)} MB)</span>
          </div>
          <button onclick="removeFile('${item.id}')" class="text-slate-400 hover:text-red-400 p-1 rounded-md transition duration-150">
            <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
            </svg>
          </button>
        `;
        
        fileListEl.appendChild(li);
      });

      mergeBtn.disabled = pdfFiles.length === 0;
    }

    // Proceso de unión de PDFs
    mergeBtn.addEventListener('click', async () => {
      if (pdfFiles.length === 0) return;

      btnText.textContent = "Procesando...";
      mergeBtn.disabled = true;

      try {
        const mergedPdf = await PDFLib.PDFDocument.create();

        for (const item of pdfFiles) {
          const fileBuffer = await item.file.arrayBuffer();
          const pdfToPage = await PDFLib.PDFDocument.load(fileBuffer);
          const copiedPages = await mergedPdf.copyPages(pdfToPage, pdfToPage.getPageIndices());
          copiedPages.forEach((page) => mergedPdf.addPage(page));
        }

        const mergedPdfBytes = await mergedPdf.save();
        
        // Descargar el archivo resultante
        const blob = new Blob([mergedPdfBytes], { type: 'application/pdf' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'documento_unido.pdf';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);

      } catch (error) {
        alert("Ocurrió un error al procesar los archivos PDF.");
        console.error(error);
      } finally {
        btnText.textContent = "Unir y Descargar PDF";
        mergeBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
