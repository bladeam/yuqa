<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Brújula Agrimensura Pro + Topografía GPS</title>
  <style>
    :root {
      --bg-color: #0d1117;
      --panel-bg: #161b22;
      --accent-color: #3fb950;
      --brass: #d4af37;
      --text-color: #f0f6fc;
      --danger: #f85149;
      --border-color: #30363d;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Courier New', Courier, monospace;
      user-select: none;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 10px;
      overflow-x: hidden;
    }

    header {
      text-align: center;
      width: 100%;
      border-bottom: 2px solid var(--brass);
      padding-bottom: 4px;
      margin-bottom: 6px;
    }

    h1 {
      font-size: 1.1rem;
      color: var(--brass);
      letter-spacing: 1px;
    }

    #statusBanner {
      width: 100%;
      background-color: #271c00;
      color: var(--brass);
      border: 1px solid var(--brass);
      padding: 5px;
      font-size: 0.68rem;
      text-align: center;
      border-radius: 4px;
      margin-bottom: 8px;
    }

    /* Brújula */
    .compass-container {
      position: relative;
      width: 250px;
      height: 250px;
      margin: 4px 0;
    }

    .outer-ring {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 5px solid var(--brass);
      box-shadow: 0 0 12px rgba(212, 175, 55, 0.25);
      background: radial-gradient(circle, #1f242c 0%, #0d1117 100%);
    }

    .sight-line {
      position: absolute;
      top: 0;
      left: 50%;
      width: 2px;
      height: 100%;
      background: rgba(255, 255, 255, 0.35);
      transform: translateX(-50%);
      z-index: 5;
      pointer-events: none;
    }

    .sight-line::before {
      content: '';
      position: absolute;
      top: 2px;
      left: 50%;
      transform: translateX(-50%);
      border-left: 6px solid transparent;
      border-right: 6px solid transparent;
      border-top: 10px solid var(--danger);
    }

    .limbo {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      will-change: transform;
    }

    .cardinal {
      position: absolute;
      font-weight: bold;
      font-size: 1rem;
      transform: translate(-50%, -50%);
    }

    .cardinal.n { top: 12%; left: 50%; color: var(--danger); }
    .cardinal.e { top: 50%; left: 88%; }
    .cardinal.s { top: 88%; left: 50%; }
    .cardinal.w { top: 50%; left: 12%; }

    /* Nivel de Burbuja */
    .bubble-level {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 60px;
      height: 60px;
      border: 1.5px solid rgba(63, 185, 80, 0.6);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0, 0, 0, 0.4);
      z-index: 4;
    }

    .bubble-center {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 8px;
      height: 8px;
      border: 1px solid var(--accent-color);
      border-radius: 50%;
      transform: translate(-50%, -50%);
    }

    .bubble {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 12px;
      height: 12px;
      background-color: var(--accent-color);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 6px var(--accent-color);
    }

    /* Paneles de Lecturas */
    .readings-panel {
      width: 100%;
      background-color: var(--panel-bg);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 8px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-top: 6px;
    }

    .data-box {
      background-color: #0d1117;
      padding: 5px 8px;
      border-radius: 4px;
      border-left: 3px solid var(--accent-color);
    }

    .data-box.highlight { border-left-color: var(--brass); }

    .data-label {
      font-size: 0.58rem;
      color: #8b949e;
      text-transform: uppercase;
    }

    .data-value {
      font-size: 0.92rem;
      font-weight: bold;
      color: #fff;
    }

    /* Controles y Botones */
    .btn-group {
      width: 100%;
      display: flex;
      gap: 6px;
      margin-top: 8px;
    }

    .btn {
      flex: 1;
      background: var(--brass);
      color: #000;
      border: none;
      padding: 10px 6px;
      font-weight: bold;
      font-size: 0.75rem;
      border-radius: 4px;
      cursor: pointer;
      text-transform: uppercase;
    }

    .btn-sec {
      background: #21262d;
      color: var(--text-color);
      border: 1px solid var(--border-color);
    }

    .btn:active { opacity: 0.8; }

    /* Tabla de Puntos Registrados */
    .log-container {
      width: 100%;
      margin-top: 10px;
      background-color: var(--panel-bg);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 8px;
      max-height: 140px;
      overflow-y: auto;
    }

    .log-title {
      font-size: 0.7rem;
      color: var(--brass);
      margin-bottom: 4px;
      text-transform: uppercase;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.65rem;
      text-align: left;
    }

    th, td {
      padding: 3px 4px;
      border-bottom: 1px solid var(--border-color);
    }

    th { color: #8b949e; }

    .ticks { position: absolute; width: 100%; height: 100%; }
  </style>
</head>
<body>

  <header>
    <h1>Brújula Agrimensura Pro</h1>
  </header>

  <div id="statusBanner">Presiona "Iniciar Sensores"</div>

  <div class="compass-container">
    <div class="outer-ring"></div>
    <div class="sight-line"></div>
    
    <div class="bubble-level">
      <div class="bubble-center"></div>
      <div id="bubble" class="bubble"></div>
    </div>

    <div id="limbo" class="limbo">
      <div class="cardinal n">N</div>
      <div class="cardinal e">E</div>
      <div class="cardinal s">S</div>
      <div class="cardinal w">W</div>
      <canvas id="ticksCanvas" width="250" height="250" class="ticks"></canvas>
    </div>
  </div>

  <!-- Lecturas Topográficas Principal -->
  <div class="readings-panel">
    <div class="data-box highlight">
      <div class="data-label">Acimut Magnético</div>
      <div id="azMagVal" class="data-value">000° 00'</div>
    </div>
    
    <div class="data-box highlight">
      <div class="data-label">Acimut Verdadero (Astr.)</div>
      <div id="azTrueVal" class="data-value">000° 00'</div>
    </div>

    <div class="data-box highlight">
      <div class="data-label">Rumbo Cuadrantal</div>
      <div id="bearingVal" class="data-value">N 00° E</div>
    </div>

    <div class="data-box">
      <div class="data-label">Declinación (D)</div>
      <div id="declinationVal" class="data-value">0.00°</div>
    </div>

    <div class="data-box">
      <div class="data-label">Inclinación / Pendiente</div>
      <div id="pitchVal" class="data-value">0.0° (0%)</div>
    </div>

    <div class="data-box">
      <div class="data-label">Coordenadas GPS</div>
      <div id="gpsVal" class="data-value">Sin GPS</div>
    </div>
  </div>

  <div class="btn-group">
    <button id="startBtn" class="btn">Iniciar Sensores</button>
    <button id="recordBtn" class="btn btn-sec">Guardar Punto</button>
  </div>

  <div class="btn-group">
    <button id="exportCsvBtn" class="btn btn-sec">Exportar CSV</button>
    <button id="exportGeoJsonBtn" class="btn btn-sec">Exportar GeoJSON</button>
  </div>

  <!-- Registro de campo -->
  <div class="log-container">
    <div class="log-title">Registro de Puntos de Campo (<span id="pointCount">0</span>)</div>
    <table>
      <thead>
        <tr>
          <th>Pto</th>
          <th>Az.Verd</th>
          <th>Rumbo</th>
          <th>Inc</th>
          <th>Lat/Lon</th>
        </tr>
      </thead>
      <tbody id="logTableBody"></tbody>
    </table>
  </div>

  <script>
    let currentAzMag = 0;
    let currentAzTrue = 0;
    let currentPitch = 0;
    let currentRoll = 0;
    let currentLat = null;
    let currentLon = null;
    let declination = 0; // Valor por defecto
    let points = [];

    const limbo = document.getElementById('limbo');
    const azMagVal = document.getElementById('azMagVal');
    const azTrueVal = document.getElementById('azTrueVal');
    const bearingVal = document.getElementById('bearingVal');
    const declinationVal = document.getElementById('declinationVal');
    const pitchVal = document.getElementById('pitchVal');
    const gpsVal = document.getElementById('gpsVal');
    const bubble = document.getElementById('bubble');
    const startBtn = document.getElementById('startBtn');
    const recordBtn = document.getElementById('recordBtn');
    const exportCsvBtn = document.getElementById('exportCsvBtn');
    const exportGeoJsonBtn = document.getElementById('exportGeoJsonBtn');
    const statusBanner = document.getElementById('statusBanner');
    const ticksCanvas = document.getElementById('ticksCanvas');
    const logTableBody = document.getElementById('logTableBody');
    const pointCount = document.getElementById('pointCount');

    // Dibujar Limbo
    function drawLimboTicks() {
      const ctx = ticksCanvas.getContext('2d');
      const cx = 125, cy = 125, r = 118;
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';

      for (let deg = 0; deg < 360; deg += 5) {
        const rad = (deg - 90) * Math.PI / 180;
        const isMajor = deg % 10 === 0;
        const len = isMajor ? 10 : 5;

        const x1 = cx + (r - len) * Math.cos(rad);
        const y1 = cy + (r - len) * Math.sin(rad);
        const x2 = cx + r * Math.cos(rad);
        const y2 = cy + r * Math.sin(rad);

        ctx.beginPath();
        ctx.lineWidth = isMajor ? 1.5 : 1;
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.stroke();
      }
    }
    drawLimboTicks();

    // Formato Cuadrantal Topográfico
    function azimuthToQuadrantBearing(az) {
      az = (az + 360) % 360;
      if (az >= 0 && az <= 90) return `N ${formatDegrees(az)} E`;
      if (az > 90 && az <= 180) return `S ${formatDegrees(180 - az)} E`;
      if (az > 180 && az <= 270) return `S ${formatDegrees(az - 180)} W`;
      return `N ${formatDegrees(360 - az)} W`;
    }

    function formatDegrees(degVal) {
      const d = Math.floor(degVal);
      const m = Math.round((degVal - d) * 60);
      return `${String(d).padStart(2, '0')}°${String(m).padStart(2, '0')}'`;
    }

    // Obtener Declinación Magnética de la API de NOAA
    async function fetchMagneticDeclination(lat, lon) {
      try {
        const dateStr = new Date().toISOString().split('T')[0];
        const url = `https://www.ngdc.noaa.gov/geomag-web/calculators/calculateDeclination?lat1=${lat}&lon1=${lon}&resultFormat=json`;
        const resp = await fetch(url);
        const data = await resp.json();
        if (data && data.result && data.result[0]) {
          declination = data.result[0].declination;
          declinationVal.textContent = `${declination > 0 ? '+' : ''}${declination.toFixed(2)}°`;
        }
      } catch (err) {
        // Estimación / Fallback si falla la API sin red
        declinationVal.textContent = `${declination.toFixed(2)}° (Manual)`;
      }
    }

    // Geolocalización del dispositivo
    function initGPS() {
      if ('geolocation' in navigator) {
        navigator.geolocation.watchPosition((pos) => {
          currentLat = pos.coords.latitude;
          currentLon = pos.coords.longitude;
          gpsVal.textContent = `${currentLat.toFixed(4)}, ${currentLon.toFixed(4)}`;
          fetchMagneticDeclination(currentLat, currentLon);
        }, (err) => {
          gpsVal.textContent = "GPS Off/Sin Permiso";
        }, { enableHighAccuracy: true });
      }
    }

    // Procesar Datos de Orientación
    function processOrientation(heading, beta, gamma) {
      currentAzMag = (heading + 360) % 360;
      currentAzTrue = (currentAzMag + declination + 360) % 360;
      currentPitch = beta;
      currentRoll = gamma;

      // Rotar limbo (Alineado al Norte Magnético o Verdadero según preferencia)
      limbo.style.transform = `rotate(${-currentAzTrue}deg)`;

      // Actualizar UI
      azMagVal.textContent = formatDegrees(currentAzMag);
      azTrueVal.textContent = formatDegrees(currentAzTrue);
      bearingVal.textContent = azimuthToQuadrantBearing(currentAzTrue);

      // Inclinación y Pendiente %
      const slopePercent = Math.tan(currentPitch * Math.PI / 180) * 100;
      pitchVal.textContent = `${currentPitch.toFixed(1)}° (${slopePercent.toFixed(1)}%)`;

      // Burbuja
      const maxDist = 22;
      const bx = Math.max(-maxDist, Math.min(maxDist, gamma));
      const by = Math.max(-maxDist, Math.min(maxDist, beta));
      bubble.style.transform = `translate(calc(-50% + ${bx}px), calc(-50% + ${by}px))`;
    }

    function handleEvent(e) {
      let heading = null;
      if (e.webkitCompassHeading !== undefined) {
        heading = e.webkitCompassHeading;
      } else if (e.alpha !== null) {
        heading = e.absolute || e.type === 'deviceorientationabsolute' ? (360 - e.alpha) : e.alpha;
      }

      if (heading !== null) {
        statusBanner.style.backgroundColor = '#0d2818';
        statusBanner.style.color = '#3fb950';
        statusBanner.textContent = "Sensores y GPS Activos";
        processOrientation(heading, e.beta || 0, e.gamma || 0);
      }
    }

    async function startSensors() {
      startBtn.style.display = 'none';
      initGPS();

      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        try {
          const resp = await DeviceOrientationEvent.requestPermission();
          if (resp === 'granted') {
            window.addEventListener('deviceorientation', handleEvent, true);
          }
        } catch (err) {
          statusBanner.textContent = "Error Permisos: " + err.message;
        }
      } else {
        if ('ondeviceorientationabsolute' in window) {
          window.addEventListener('deviceorientationabsolute', handleEvent, true);
        } else {
          window.addEventListener('deviceorientation', handleEvent, true);
        }
      }
    }

    // Registrar Punto Topográfico
    recordBtn.addEventListener('click', () => {
      const ptoNum = points.length + 1;
      const pointData = {
        id: ptoNum,
        azMag: currentAzMag.toFixed(2),
        azTrue: currentAzTrue.toFixed(2),
        bearing: azimuthToQuadrantBearing(currentAzTrue),
        pitch: currentPitch.toFixed(1),
        lat: currentLat ? currentLat.toFixed(6) : "N/A",
        lon: currentLon ? currentLon.toFixed(6) : "N/A",
        timestamp: new Date().toISOString()
      };
      
      points.push(pointData);
      pointCount.textContent = points.length;

      const row = document.createElement('tr');
      row.innerHTML = `
        <td>P${ptoNum}</td>
        <td>${formatDegrees(currentAzTrue)}</td>
        <td>${pointData.bearing}</td>
        <td>${pointData.pitch}°</td>
        <td>${pointData.lat}, ${pointData.lon}</td>
      `;
      logTableBody.appendChild(row);
    });

    // Exportar CSV (Excel / Civil3D)
    exportCsvBtn.addEventListener('click', () => {
      if (points.length === 0) return alert("No hay puntos registrados");
      let csvContent = "data:text/csv;charset=utf-8,Punto,Azimut_Mag,Azimut_Verdadero,Rumbo,Inclinacion_Grados,Latitud,Longitud,Fecha_Hora\n";
      points.forEach(p => {
        csvContent += `${p.id},${p.azMag},${p.azTrue},"${p.bearing}",${p.pitch},${p.lat},${p.lon},${p.timestamp}\n`;
      });
      const encodedUri = encodeURI(csvContent);
      const link = document.createElement("a");
      link.setAttribute("href", encodedUri);
      link.setAttribute("download", `lev_topografico_${Date.now()}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    });

    // Exportar GeoJSON (QGIS / ArcGIS)
    exportGeoJsonBtn.addEventListener('click', () => {
      if (points.length === 0) return alert("No hay puntos registrados");
      const features = points.filter(p => p.lat !== "N/A").map(p => ({
        type: "Feature",
        geometry: {
          type: "Point",
          coordinates: [parseFloat(p.lon), parseFloat(p.lat)]
        },
        properties: {
          punto: p.id,
          azimut_verdadero: parseFloat(p.azTrue),
          rumbo: p.bearing,
          inclinacion: parseFloat(p.pitch),
          fecha: p.timestamp
        }
      }));

      const geojson = {
        type: "FeatureCollection",
        features: features
      };

      const blob = new Blob([JSON.stringify(geojson, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = `lev_topografico_${Date.now()}.geojson`;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    });

    startBtn.addEventListener('click', startSensors);
  </script>
</body>
</html>
