<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Brújula de Agrimensor Pro</title>
  <style>
    :root {
      --bg-color: #0f1416;
      --panel-bg: #1a2226;
      --accent-color: #00e676;
      --brass: #d4af37;
      --text-color: #f5f5f5;
      --danger: #ff1744;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Courier New', Courier, monospace;
      user-select: none;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      min-height: 100vh;
      padding: 12px;
      overflow: hidden;
    }

    header {
      text-align: center;
      width: 100%;
      border-bottom: 2px solid var(--brass);
      padding-bottom: 6px;
    }

    h1 {
      font-size: 1.1rem;
      color: var(--brass);
      letter-spacing: 1px;
    }

    /* Mensaje de Advertencia / Estado */
    #statusBanner {
      width: 100%;
      background-color: #2a1b00;
      color: var(--brass);
      border: 1px solid var(--brass);
      padding: 6px;
      font-size: 0.7rem;
      text-align: center;
      border-radius: 4px;
      margin-top: 6px;
    }

    /* Contenedor Principal */
    .compass-container {
      position: relative;
      width: 280px;
      height: 280px;
      margin: 10px 0;
    }

    .outer-ring {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 6px solid var(--brass);
      box-shadow: 0 0 15px rgba(212, 175, 55, 0.2);
      background: radial-gradient(circle, #222b30 0%, #0f1416 100%);
    }

    .sight-line {
      position: absolute;
      top: 0;
      left: 50%;
      width: 2px;
      height: 100%;
      background: rgba(255, 255, 255, 0.3);
      transform: translateX(-50%);
      z-index: 5;
      pointer-events: none;
    }

    .sight-line::before {
      content: '';
      position: absolute;
      top: 2px;
      left: 50%;
      transform: translateX(-50%);
      border-left: 7px solid transparent;
      border-right: 7px solid transparent;
      border-top: 10px solid var(--danger);
    }

    .limbo {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      will-change: transform;
    }

    .cardinal {
      position: absolute;
      font-weight: bold;
      font-size: 1.1rem;
      transform: translate(-50%, -50%);
    }

    .cardinal.n { top: 12%; left: 50%; color: var(--danger); }
    .cardinal.e { top: 50%; left: 88%; }
    .cardinal.s { top: 88%; left: 50%; }
    .cardinal.w { top: 50%; left: 12%; }

    /* Nivel de Burbuja */
    .bubble-level {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 70px;
      height: 70px;
      border: 1.5px solid rgba(0, 230, 118, 0.6);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0, 0, 0, 0.4);
      z-index: 4;
    }

    .bubble-center {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 8px;
      height: 8px;
      border: 1px solid var(--accent-color);
      border-radius: 50%;
      transform: translate(-50%, -50%);
    }

    .bubble {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 12px;
      height: 12px;
      background-color: var(--accent-color);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 6px var(--accent-color);
    }

    /* Panel de Lecturas */
    .readings-panel {
      width: 100%;
      background-color: var(--panel-bg);
      border: 1px solid #2a363c;
      border-radius: 6px;
      padding: 10px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .data-box {
      background-color: #0f1416;
      padding: 6px 8px;
      border-radius: 4px;
      border-left: 3px solid var(--accent-color);
    }

    .data-box.highlight {
      border-left-color: var(--brass);
    }

    .data-label {
      font-size: 0.6rem;
      color: #888;
      text-transform: uppercase;
    }

    .data-value {
      font-size: 1rem;
      font-weight: bold;
      color: #fff;
    }

    .btn-action {
      background: var(--brass);
      color: #000;
      border: none;
      padding: 12px;
      font-weight: bold;
      font-size: 0.85rem;
      border-radius: 4px;
      cursor: pointer;
      width: 100%;
      text-transform: uppercase;
      margin-top: 4px;
    }

    .ticks {
      position: absolute;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>

  <header>
    <h1>Brújula Agrimensura</h1>
  </header>

  <div id="statusBanner">Presiona "Iniciar Sensores" para calibrar</div>

  <div class="compass-container">
    <div class="outer-ring"></div>
    <div class="sight-line"></div>
    
    <div class="bubble-level">
      <div class="bubble-center"></div>
      <div id="bubble" class="bubble"></div>
    </div>

    <div id="limbo" class="limbo">
      <div class="cardinal n">N</div>
      <div class="cardinal e">E</div>
      <div class="cardinal s">S</div>
      <div class="cardinal w">W</div>
      <canvas id="ticksCanvas" width="280" height="280" class="ticks"></canvas>
    </div>
  </div>

  <div class="readings-panel">
    <div class="data-box highlight">
      <div class="data-label">Acimut (Az)</div>
      <div id="azimuthVal" class="data-value">000° 00'</div>
    </div>
    
    <div class="data-box highlight">
      <div class="data-label">Rumbo (Cuadrantal)</div>
      <div id="bearingVal" class="data-value">N 00° E</div>
    </div>

    <div class="data-box">
      <div class="data-label">Inclinación (Pitch)</div>
      <div id="pitchVal" class="data-value">0.0°</div>
    </div>

    <div class="data-box">
      <div class="data-label">Pendiente (Roll)</div>
      <div id="rollVal" class="data-value">0.0°</div>
    </div>
  </div>

  <button id="startBtn" class="btn-action">Iniciar Sensores</button>

  <script>
    const limbo = document.getElementById('limbo');
    const azimuthVal = document.getElementById('azimuthVal');
    const bearingVal = document.getElementById('bearingVal');
    const pitchVal = document.getElementById('pitchVal');
    const rollVal = document.getElementById('rollVal');
    const bubble = document.getElementById('bubble');
    const startBtn = document.getElementById('startBtn');
    const statusBanner = document.getElementById('statusBanner');
    const ticksCanvas = document.getElementById('ticksCanvas');

    // Comprobación de Protocolo Seguro (HTTPS)
    if (window.location.protocol !== 'https:' && window.location.hostname !== 'localhost' && window.location.hostname !== '127.0.0.1') {
      statusBanner.style.backgroundColor = '#3a0000';
      statusBanner.style.color = '#ff5252';
      statusBanner.textContent = "Error: Requiere HTTPS para acceder a los sensores del móvil.";
    }

    // Dibujar Limbo
    function drawLimboTicks() {
      const ctx = ticksCanvas.getContext('2d');
      const cx = 140, cy = 140, r = 130;
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';

      for (let deg = 0; deg < 360; deg += 5) {
        const rad = (deg - 90) * Math.PI / 180;
        const isMajor = deg % 10 === 0;
        const len = isMajor ? 10 : 5;

        const x1 = cx + (r - len) * Math.cos(rad);
        const y1 = cy + (r - len) * Math.sin(rad);
        const x2 = cx + r * Math.cos(rad);
        const y2 = cy + r * Math.sin(rad);

        ctx.beginPath();
        ctx.lineWidth = isMajor ? 1.5 : 1;
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.stroke();
      }
    }
    drawLimboTicks();

    // Formato Cuadrantal Topográfico
    function azimuthToQuadrantBearing(az) {
      if (az >= 0 && az <= 90) return `N ${formatDegrees(az)} E`;
      if (az > 90 && az <= 180) return `S ${formatDegrees(180 - az)} E`;
      if (az > 180 && az <= 270) return `S ${formatDegrees(az - 180)} W`;
      return `N ${formatDegrees(360 - az)} W`;
    }

    function formatDegrees(degVal) {
      const d = Math.floor(degVal);
      const m = Math.round((degVal - d) * 60);
      return `${String(d).padStart(2, '0')}°${String(m).padStart(2, '0')}'`;
    }

    // Procesar datos del sensor
    function processOrientation(heading, beta, gamma) {
      heading = (heading + 360) % 360;

      // Rotación suave del limbo
      limbo.style.transform = `rotate(${-heading}deg)`;

      // Actualizar interfaz
      azimuthVal.textContent = formatDegrees(heading);
      bearingVal.textContent = azimuthToQuadrantBearing(heading);
      pitchVal.textContent = `${beta.toFixed(1)}°`;
      rollVal.textContent = `${gamma.toFixed(1)}°`;

      // Posición de la burbuja
      const maxDist = 25;
      const bx = Math.max(-maxDist, Math.min(maxDist, gamma));
      const by = Math.max(-maxDist, Math.min(maxDist, beta));
      bubble.style.transform = `translate(calc(-50% + ${bx}px), calc(-50% + ${by}px))`;
    }

    function handleEvent(e) {
      let heading = null;

      // 1. Detección en iOS (webkitCompassHeading)
      if (e.webkitCompassHeading !== undefined) {
        heading = e.webkitCompassHeading;
      } 
      // 2. Detección Absoluta en Android (deviceorientationabsolute)
      else if (e.alpha !== null) {
        heading = e.absolute || e.type === 'deviceorientationabsolute' ? (360 - e.alpha) : e.alpha;
      }

      if (heading !== null) {
        statusBanner.style.backgroundColor = '#002a0f';
        statusBanner.style.color = '#00e676';
        statusBanner.textContent = "Sensores Activos y Calibrados";
        processOrientation(heading, e.beta || 0, e.gamma || 0);
      }
    }

    // Activación de eventos
    async function startSensors() {
      startBtn.style.display = 'none';

      // iOS 13+ requerimiento explícito
      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        try {
          const response = await DeviceOrientationEvent.requestPermission();
          if (response === 'granted') {
            window.addEventListener('deviceorientation', handleEvent, true);
          } else {
            statusBanner.textContent = "Permiso denegado por el usuario.";
          }
        } catch (err) {
          statusBanner.textContent = "Error al solicitar permisos: " + err.message;
        }
      } else {
        // Android / W3C Estándar
        if ('ondeviceorientationabsolute' in window) {
          window.addEventListener('deviceorientationabsolute', handleEvent, true);
        } else if ('ondeviceorientation' in window) {
          window.addEventListener('deviceorientation', handleEvent, true);
        } else {
          statusBanner.textContent = "Este dispositivo/navegador no soporta sensores de orientación.";
        }
      }
    }

    startBtn.addEventListener('click', startSensors);
  </script>
</body>
</html>
