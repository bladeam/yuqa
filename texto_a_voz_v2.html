<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lumina Voice - Texto a Voz Studio</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --text: #f8fafc;
      --subtext: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      background: var(--card);
      width: 100%;
      max-width: 600px;
      padding: 30px;
      border-radius: 24px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    h1 {
      font-size: 1.8rem;
      margin-bottom: 8px;
      text-align: center;
      background: linear-gradient(135deg, #a5b4fc, var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p.subtitle {
      color: var(--subtext);
      text-align: center;
      font-size: 0.9rem;
      margin-bottom: 24px;
    }

    textarea {
      width: 100%;
      height: 140px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 14px;
      color: var(--text);
      font-size: 1rem;
      resize: none;
      outline: none;
      transition: border-color 0.2s;
    }

    textarea:focus {
      border-color: var(--accent);
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin: 20px 0;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .control-group.full {
      grid-column: span 2;
    }

    label {
      font-size: 0.85rem;
      color: var(--subtext);
      display: flex;
      justify-content: space-between;
    }

    select, input[type="range"] {
      background: #0f172a;
      border: 1px solid #334155;
      color: var(--text);
      padding: 10px;
      border-radius: 8px;
      outline: none;
    }

    select {
      cursor: pointer;
    }

    /* Visualizador de Onda */
    .visualizer {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 4px;
      height: 30px;
      margin-bottom: 20px;
    }

    .bar {
      width: 4px;
      height: 6px;
      background: var(--accent);
      border-radius: 4px;
      transition: height 0.1s ease;
    }

    .visualizer.active .bar {
      animation: pulse 0.5s infinite alternate ease-in-out;
    }

    .visualizer.active .bar:nth-child(1) { animation-delay: 0.1s; }
    .visualizer.active .bar:nth-child(2) { animation-delay: 0.3s; }
    .visualizer.active .bar:nth-child(3) { animation-delay: 0.2s; }
    .visualizer.active .bar:nth-child(4) { animation-delay: 0.4s; }
    .visualizer.active .bar:nth-child(5) { animation-delay: 0.1s; }

    @keyframes pulse {
      0% { height: 6px; opacity: 0.5; }
      100% { height: 28px; opacity: 1; }
    }

    /* Botones */
    .btn-group {
      display: flex;
      gap: 12px;
    }

    button {
      flex: 1;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-primary {
      background: var(--accent);
      color: white;
    }

    .btn-primary:hover {
      background: var(--accent-hover);
    }

    .btn-secondary {
      background: #334155;
      color: var(--text);
    }

    .btn-secondary:hover {
      background: #475569;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Lumina Voice</h1>
    <p class="subtitle">Convertidor de Texto a Voz Avanzado</p>

    <textarea id="text-input" placeholder="Escribe o pega el texto que deseas escuchar aquí..."></textarea>

    <div class="controls">
      <div class="control-group full">
        <label for="voice-select">Voz Narradora</label>
        <select id="voice-select">
          <option value="">Cargando voces...</option>
        </select>
      </div>

      <div class="control-group">
        <label for="rate">Velocidad: <span id="rate-val">1.0x</span></label>
        <input type="range" id="rate" min="0.5" max="2" value="1" step="0.1">
      </div>

      <div class="control-group">
        <label for="pitch">Tono: <span id="pitch-val">1.0</span></label>
        <input type="range" id="pitch" min="0.5" max="2" value="1" step="0.1">
      </div>
    </div>

    <div class="visualizer" id="visualizer">
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
    </div>

    <div class="btn-group">
      <button id="play-btn" class="btn-primary">Reproducir</button>
      <button id="pause-btn" class="btn-secondary">Pausar</button>
      <button id="stop-btn" class="btn-secondary">Detener</button>
    </div>
  </div>

  <script>
    const synth = window.speechSynthesis;

    const textInput = document.getElementById('text-input');
    const voiceSelect = document.getElementById('voice-select');
    const rateInput = document.getElementById('rate');
    const pitchInput = document.getElementById('pitch');
    const rateVal = document.getElementById('rate-val');
    const pitchVal = document.getElementById('pitch-val');

    const playBtn = document.getElementById('play-btn');
    const pauseBtn = document.getElementById('pause-btn');
    const stopBtn = document.getElementById('stop-btn');
    const visualizer = document.getElementById('visualizer');

    let voices = [];

    // Cargar las voces disponibles en el navegador
    function loadVoices() {
      voices = synth.getVoices();
      voiceSelect.innerHTML = '';

      if (voices.length === 0) return;

      // Priorizar voces en español arriba en la lista
      voices.sort((a, b) => (a.lang.includes('es') ? -1 : 1));

      voices.forEach((voice, index) => {
        const option = document.createElement('option');
        option.textContent = `${voice.name} (${voice.lang})`;
        option.setAttribute('data-index', index);
        if (voice.lang.includes('es')) {
          option.textContent += ' — Recommended';
        }
        voiceSelect.appendChild(option);
      });
    }

    loadVoices();
    if (speechSynthesis.onvoiceschanged !== undefined) {
      speechSynthesis.onvoiceschanged = loadVoices;
    }

    // Actualizar etiquetas de rangos
    rateInput.addEventListener('input', () => rateVal.textContent = `${rateInput.value}x`);
    pitchInput.addEventListener('input', () => pitchVal.textContent = pitchInput.value);

    // Hablar
    function speak() {
      if (synth.speaking) {
        if (synth.isPaused) {
          synth.resume();
          visualizer.classList.add('active');
          return;
        }
      }

      if (textInput.value.trim() !== '') {
        synth.cancel(); // Detener cualquier lectura previa

        const utterance = new SpeechSynthesisUtterance(textInput.value);
        
        const selectedIndex = voiceSelect.selectedOptions[0]?.getAttribute('data-index');
        if (selectedIndex) {
          utterance.voice = voices[selectedIndex];
        }

        utterance.rate = parseFloat(rateInput.value);
        utterance.pitch = parseFloat(pitchInput.value);

        // Eventos para el visualizador
        utterance.onstart = () => visualizer.classList.add('active');
        utterance.onend = () => visualizer.classList.remove('active');
        utterance.onerror = () => visualizer.classList.remove('active');

        synth.speak(utterance);
      }
    }

    // Controles
    playBtn.addEventListener('click', speak);

    pauseBtn.addEventListener('click', () => {
      if (synth.speaking && !synth.isPaused) {
        synth.pause();
        visualizer.classList.remove('active');
      }
    });

    stopBtn.addEventListener('click', () => {
      if (synth.speaking) {
        synth.cancel();
        visualizer.classList.remove('active');
      }
    });
  </script>
</body>
</html>
