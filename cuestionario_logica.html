<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cuestionario de Lógica Proposicional</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --border: #e2e8f0;
            --success: #16a34a;
            --error: #dc2626;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            flex-grow: 1;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: #0f172a;
            margin-bottom: 24px;
            font-size: 1.8rem;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }

        textarea, input[type="number"] {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 1rem;
        }

        textarea {
            height: 100px;
            resize: vertical;
        }

        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
            width: 100%;
            font-weight: 600;
            transition: background 0.2s;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }

        .btn-option {
            width: 48%;
            padding: 15px;
            font-size: 1.2rem;
            margin: 10px 1%;
        }

        .screen {
            display: none;
        }

        .screen.active {
            display: block;
        }

        .question-box {
            background: #f1f5f9;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            font-size: 1.8rem;
            font-weight: bold;
            margin: 20px 0;
        }

        /* Estilo para disyunción excluyente */
        .symbol-xor {
            text-decoration: underline;
            text-underline-offset: 4px;
            display: inline-block;
        }

        .feedback {
            margin: 15px 0;
            padding: 16px;
            border-radius: 8px;
            text-align: center;
            display: none;
        }

        .feedback.correct {
            background-color: #dcfce7;
            color: var(--success);
            border: 2px solid #86efac;
        }

        .feedback.correct .title {
            font-size: 1.8rem;
            font-weight: 900;
            margin-bottom: 6px;
        }

        .feedback.incorrect {
            background-color: #fee2e2;
            color: var(--error);
            border: 2px solid #fca5a5;
        }

        /* Texto grande para respuesta incorrecta */
        .feedback.incorrect .title {
            font-size: 2.2rem;
            font-weight: 900;
            letter-spacing: 2px;
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        .feedback .detail {
            font-size: 1.1rem;
            font-weight: 600;
        }

        .participant-header {
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--primary);
            margin-bottom: 10px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            border: 1px solid var(--border);
            padding: 10px;
            text-align: left;
        }

        th {
            background-color: #f8fafc;
        }

        footer {
            text-align: center;
            margin-top: 30px;
            padding: 15px;
            font-size: 0.9rem;
            color: #64748b;
            border-top: 1px solid var(--border);
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Cuestionario de Lógica Proposicional</h1>

    <!-- Pantalla 1: Configuración Inicial -->
    <div id="screen-config" class="screen active">
        <div class="form-group">
            <label for="participants">Lista de Participantes (uno por fila):</label>
            <textarea id="participants" placeholder="Juan Pérez&#10;María López&#10;Carlos Gómez"></textarea>
        </div>
        <div class="form-group">
            <label for="num-questions">Número de preguntas por participante:</label>
            <input type="number" id="num-questions" min="1" max="20" value="5">
        </div>
        <button class="btn" onclick="startQuiz()">Iniciar Cuestionario</button>
    </div>

    <!-- Pantalla 2: Preguntas -->
    <div id="screen-quiz" class="screen">
        <div class="participant-header" id="current-participant-title"></div>
        <div id="question-tracker" style="color: #64748b; margin-bottom: 10px;"></div>
        
        <div class="question-box" id="question-text"></div>

        <div style="display: flex; justify-content: center;">
            <button class="btn btn-option" onclick="answerQuestion('V')">V</button>
            <button class="btn btn-option" onclick="answerQuestion('F')">F</button>
        </div>

        <div id="feedback-msg" class="feedback">
            <div id="feedback-title" class="title"></div>
            <div id="feedback-detail" class="detail"></div>
        </div>
        <button id="btn-next" class="btn" style="margin-top: 15px; display: none;" onclick="nextQuestion()">Siguiente Pregunta</button>
    </div>

    <!-- Pantalla 3: Resultados Finales -->
    <div id="screen-results" class="screen">
        <h2>Resultados y Historial</h2>
        <div id="summary-results"></div>
        <button class="btn" style="margin-top: 20px;" onclick="resetQuiz()">Volver al Inicio</button>
    </div>
</div>

<footer>
    Copyright Bladimir Arias Mejia
</footer>

<script>
    const LOGIC_OPERATIONS = [
        {
            name: "Conjunción",
            symbolHtml: "∧",
            eval: (p, q) => (p === 'V' && q === 'V') ? 'V' : 'F'
        },
        {
            name: "Disyunción incluyente",
            symbolHtml: "∨",
            eval: (p, q) => (p === 'F' && q === 'F') ? 'F' : 'V'
        },
        {
            name: "Disyunción excluyente",
            symbolHtml: '<span class="symbol-xor">∨</span>',
            eval: (p, q) => (p !== q) ? 'V' : 'F'
        },
        {
            name: "Implicación",
            symbolHtml: "→",
            eval: (p, q) => (p === 'V' && q === 'F') ? 'F' : 'V'
        },
        {
            name: "Doble implicación",
            symbolHtml: "↔",
            eval: (p, q) => (p === q) ? 'V' : 'F'
        }
    ];

    let participantsList = [];
    let questionsPerPerson = 0;
    
    let currentParticipantIndex = 0;
    let currentQuestionIndex = 0;
    
    let currentQuestion = null;
    let participantScores = [];
    let globalHistory = [];

    function startQuiz() {
        const rawText = document.getElementById('participants').value.trim();
        questionsPerPerson = parseInt(document.getElementById('num-questions').value);

        if (!rawText) {
            alert('Por favor, ingresa al menos un participante.');
            return;
        }

        if (isNaN(questionsPerPerson) || questionsPerPerson < 1) {
            alert('Por favor, ingresa un número válido de preguntas.');
            return;
        }

        participantsList = rawText.split('\n').map(p => p.trim()).filter(p => p.length > 0);
        
        currentParticipantIndex = 0;
        currentQuestionIndex = 0;
        participantScores = participantsList.map(() => ({ correct: 0, total: 0 }));
        globalHistory = [];

        showScreen('screen-quiz');
        loadQuestion();
    }

    function generateRandomQuestion() {
        const values = ['V', 'F'];
        const p = values[Math.floor(Math.random() * values.length)];
        const q = values[Math.floor(Math.random() * values.length)];
        const op = LOGIC_OPERATIONS[Math.floor(Math.random() * LOGIC_OPERATIONS.length)];
        
        const expected = op.eval(p, q);

        return {
            p: p,
            q: q,
            opSymbolHtml: op.symbolHtml,
            expected: expected
        };
    }

    function loadQuestion() {
        const feedbackEl = document.getElementById('feedback-msg');
        feedbackEl.style.display = 'none';
        feedbackEl.className = 'feedback';
        document.getElementById('btn-next').style.display = 'none';

        const currentName = participantsList[currentParticipantIndex];
        document.getElementById('current-participant-title').innerText = `Participante: ${currentName}`;
        document.getElementById('question-tracker').innerText = `Pregunta ${currentQuestionIndex + 1} de ${questionsPerPerson}`;

        currentQuestion = generateRandomQuestion();
        document.getElementById('question-text').innerHTML = `${currentQuestion.p} ${currentQuestion.opSymbolHtml} ${currentQuestion.q} = ___`;

        const optionBtns = document.querySelectorAll('.btn-option');
        optionBtns.forEach(btn => btn.disabled = false);
    }

    function answerQuestion(selectedAnswer) {
        const optionBtns = document.querySelectorAll('.btn-option');
        optionBtns.forEach(btn => btn.disabled = true);

        const isCorrect = selectedAnswer === currentQuestion.expected;
        const feedbackEl = document.getElementById('feedback-msg');
        const feedbackTitle = document.getElementById('feedback-title');
        const feedbackDetail = document.getElementById('feedback-detail');

        if (isCorrect) {
            feedbackTitle.innerText = "¡CORRECTO!";
            feedbackDetail.innerText = `La respuesta correcta es: ${currentQuestion.expected}`;
            feedbackEl.className = "feedback correct";
            participantScores[currentParticipantIndex].correct++;
        } else {
            feedbackTitle.innerText = "INCORRECTO";
            feedbackDetail.innerText = `La respuesta correcta es: ${currentQuestion.expected}`;
            feedbackEl.className = "feedback incorrect";
        }
        
        // Mostrar explícitamente el cuadro de mensaje
        feedbackEl.style.display = 'block';

        participantScores[currentParticipantIndex].total++;

        globalHistory.push({
            participant: participantsList[currentParticipantIndex],
            questionHtml: `${currentQuestion.p} ${currentQuestion.opSymbolHtml} ${currentQuestion.q}`,
            selected: selectedAnswer,
            expected: currentQuestion.expected,
            isCorrect: isCorrect
        });

        document.getElementById('btn-next').style.display = 'block';
    }

    function nextQuestion() {
        currentQuestionIndex++;
        if (currentQuestionIndex < questionsPerPerson) {
            loadQuestion();
        } else {
            currentQuestionIndex = 0;
            currentParticipantIndex++;
            if (currentParticipantIndex < participantsList.length) {
                loadQuestion();
            } else {
                showResults();
            }
        }
    }

    function showResults() {
        showScreen('screen-results');
        const summaryContainer = document.getElementById('summary-results');
        
        let html = `<h3>Puntajes Finales</h3><table>
            <thead>
                <tr>
                    <th>Participante</th>
                    <th>Aciertos</th>
                    <th>Nota (%)</th>
                </tr>
            </thead>
            <tbody>`;

        participantsList.forEach((name, idx) => {
            const score = participantScores[idx];
            const percentage = ((score.correct / score.total) * 100).toFixed(1);
            html += `<tr>
                <td>${name}</td>
                <td>${score.correct} / ${score.total}</td>
                <td><strong>${percentage}%</strong></td>
            </tr>`;
        });

        html += `</tbody></table><br><h3>Historial Detallado</h3><table>
            <thead>
                <tr>
                    <th>Participante</th>
                    <th>Pregunta</th>
                    <th>Respuesta Dada</th>
                    <th>Respuesta Correcta</th>
                    <th>Estado</th>
                </tr>
            </thead>
            <tbody>`;

        globalHistory.forEach(item => {
            html += `<tr>
                <td>${item.participant}</td>
                <td>${item.questionHtml}</td>
                <td>${item.selected}</td>
                <td>${item.expected}</td>
                <td style="color: ${item.isCorrect ? 'var(--success)' : 'var(--error)'}; font-weight: bold;">
                    ${item.isCorrect ? 'Correcto' : 'Incorrecto'}
                </td>
            </tr>`;
        });

        html += `</tbody></table>`;
        summaryContainer.innerHTML = html;
    }

    function showScreen(screenId) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(screenId).classList.add('active');
    }

    function resetQuiz() {
        showScreen('screen-config');
    }
</script>

</body>
</html>
