        }
        
        button {
            background-color: #3493db;
            color: white;
            border: none;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        
        button:hover {
            background-color: #2980b9;
        }
        
        button:disabled {
            background-color: #95a5a6;
            cursor: not-allowed;
        }
        
        .student-list {
            margin-top: 10px;
        }

            display: flex;

            align-items: center;
            padding: 8px;
            background-color: #e8f4fc;
            margin-bottom: 5px;
            border-radius: 4px;
        }
        
        .game-section {
            text-align: center;
        }
        
        .sentence {
            font-size: 24px;
            margin: 20px 0;
            padding: 15px;
            background-color: #f0f8ff;
            border-radius: 8px;
        }
        
        .blank {
            display: inline-block;
            min-width: 100px;
            border-bottom: 2px dashed #3498db;
            padding: 0 5px;
            color: #e74c3c;
            font-weight: bold;
        }
        
        .translation {
            font-size: 18px;
            color: #7f8c8d;
            margin-bottom: 20px;
        }
        
        .options {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .option-btn {
            min-width: 120px;
            font-size: 16px;
            color: red;
        }
        
        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .feedback {
            margin: 15px 0;
            padding: 10px;
            border-radius: 5px;
            font-weight: bold;
        }
        
        .correct {
            background-color: #d4edda;
            color: #155724;
        }
        
        .incorrect {
            background-color: #f8d7da;
            color: #721c24;
        }

            margin-top: 20px;
        }
        
        .history-item {
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 5px;
            background-color: #f8f9fa;
        }

            margin-top: 20px;
            padding: 15px;
            background-color: #e8f4fc;
            border-radius: 8px;
        }
        
        .author {
            text-align: center;

            </div>

            </div>
            
            <div id="students-list" class="student-list"></div>
            
            <button id="start-game" style="margin-top: 20px;">Comenzar Juego</button>
        </div>
        
        <!-- Juego -->
        <div id="game-section" class="section game-section hidden">

            <div class="controls">

                <button id="skip-turn">Pasar turno</button>
            </div>
            
            <button id="finish-game">Finalizar juego</button>

        <div class="author">

        // Variables globales
        let students = [];
        let currentPlayerIndex = 0;
        let questions = [];
        let currentQuestionIndex = 0;
        let correctAnswers = 0;
        let wrongAnswers = 0;
        let answerHistory = [];
        let totalQuestions = 5;
        let usedIndices = new Set();

        // Elementos DOM
        const setupSection = document.getElementById('setup-section');
        const gameSection = document.getElementById('game-section');
        const resultsSection = document.getElementById('results-section');
        const studentsList = document.getElementById('students-list');
        const studentNameInput = document.getElementById('student-name');
        const numQuestionsInput = document.getElementById('num-questions');
        const currentPlayerSpan = document.getElementById('current-player');
        const sentenceDisplay = document.getElementById('sentence-display');
        const translationDisplay = document.getElementById('translation');
        const optionsContainer = document.getElementById('options-container');
        const feedbackDiv = document.getElementById('feedback');
        const gameSummary = document.getElementById('game-summary');
        const answersHistory = document.getElementById('answers-history');

        // suffixs posibles
        const suffixes = ['rqani', 'rqanki', 'rqa', 'rqanchik', 'rqayku', 'rqankichik', 'rqanku'];

        // Inicialización
        document.getElementById('add-student').addEventListener('click', addStudent);
        document.getElementById('start-game').addEventListener('click', startGame);
        document.getElementById('next-sentence').addEventListener('click', nextSentence);
        document.getElementById('skip-turn').addEventListener('click', skipTurn);
        document.getElementById('finish-game').addEventListener('click', finishGame);
        document.getElementById('new-game').addEventListener('click', newGame);

        // Funciones
        function addStudent() {
            const name = studentNameInput.value.trim();
            if (name) {
                students.push(name);
                studentNameInput.value = '';
                updateStudentsList();
            }
        }

        function updateStudentsList() {
            studentsList.innerHTML = '';
            students.forEach((student, index) => {
                const div = document.createElement('div');
                div.className = 'student-item';
                div.innerHTML = `
                    <span>${student}</span>
                    <button onclick="removeStudent(${index})">Eliminar</button>
                `;
                studentsList.appendChild(div);
            });
        }

        function removeStudent(index) {
            students.splice(index, 1);
            updateStudentsList();
        }

        function startGame() {
            totalQuestions = parseInt(numQuestionsInput.value) || 5;
            
            // Si no hay estudiantes, añadir uno genérico
            if (students.length === 0) {
                students = ['Jugador 1'];
            }
            
            // Preparar preguntas
            prepareQuestions();
            
            // Ocultar configuración y mostrar juego
            setupSection.classList.add('hidden');
            gameSection.classList.remove('hidden');
            
            // Iniciar primera pregunta
            currentPlayerIndex = 0;
            currentQuestionIndex = 0;
            correctAnswers = 0;
            wrongAnswers = 0;
            answerHistory = [];
            
            showQuestion();
        }

        function prepareQuestions() {
            questions = [];
            usedIndices.clear();
            
            // Seleccionar preguntas aleatorias sin repetir
            while (questions.length < totalQuestions && questions.length < conjugationsData.length) {
                const randomIndex = Math.floor(Math.random() * conjugationsData.length);
                if (!usedIndices.has(randomIndex)) {
                    usedIndices.add(randomIndex);
                    questions.push(conjugationsData[randomIndex]);
                }
            }
        }

        function showQuestion() {
            if (currentQuestionIndex >= questions.length) {
                finishGame();
                return;
            }
            
            const question = questions[currentQuestionIndex];
            currentPlayerSpan.textContent = students[currentPlayerIndex];
            
            // Crear oración con espacio en blanco para el suffix
            const verbParts = question.quechua.split(' ');
            const base = verbParts[0]; // El pronombre
            const verbRoot = question.quechua.replace(base + ' ', '').replace(question.suffix, '');
            
            sentenceDisplay.innerHTML = `${base} ${verbRoot}<span class="blank" id="blank-suffix">______</span>`;
            translationDisplay.textContent = question.spanish;
            
            // Preparar opciones (suffixs)
            optionsContainer.innerHTML = '';
            
            // Mezclar los suffixs para mostrar opciones aleatorias
            const shuffledSuffixes = [...suffixes].sort(() => Math.random() - 0.5);
            
            shuffledSuffixes.forEach(suffix => {
                const button = document.createElement('button');
                button.className = 'option-btn';
                button.textContent = suffix;
                button.addEventListener('click', () => checkAnswer(suffix, question.suffix));
                optionsContainer.appendChild(button);
            });
            
            // Limpiar feedback
            feedbackDiv.className = 'feedback';
            feedbackDiv.textContent = '';
        }

        function checkAnswer(selectedSuffix, correctSuffix) {
            const blankElement = document.getElementById('blank-suffix');
            blankElement.textContent = selectedSuffix;
            
            // Deshabilitar botones de opciones
            const optionButtons = document.querySelectorAll('.option-btn');
            optionButtons.forEach(btn => btn.disabled = true);
            
            // Verificar respuesta
            const isCorrect = selectedSuffix === correctSuffix;
            
            if (isCorrect) {
                feedbackDiv.className = 'feedback correct';
                feedbackDiv.textContent = '¡Correcto!';
                correctAnswers++;
            } else {
                feedbackDiv.className = 'feedback incorrect';
                feedbackDiv.textContent = `Te equivocaste. La respuesta correcta es: ${correctSuffix}`;
                wrongAnswers++;
            }
            
            // Registrar en historial
            const currentQuestion = questions[currentQuestionIndex];
            answerHistory.push({
                player: students[currentPlayerIndex],
                question: currentQuestion.quechua,
                translation: currentQuestion.spanish,
                selected: selectedSuffix,
                correct: correctSuffix,
                isCorrect: isCorrect
            });
            
            // Avanzar después de un breve delay
            setTimeout(() => {
                nextPlayer();
                currentQuestionIndex++;
                showQuestion();
            }, 1500);
        }

        function nextPlayer() {
            currentPlayerIndex = (currentPlayerIndex + 1) % students.length;
        }

        function nextSentence() {
            currentQuestionIndex++;
            if (currentQuestionIndex >= questions.length) {
                finishGame();
            } else {
                showQuestion();
            }
        }

        function skipTurn() {
            nextPlayer();
            showQuestion();
        }

        function finishGame() {
            gameSection.classList.add('hidden');
            resultsSection.classList.remove('hidden');
            
            // Mostrar resumen
            gameSummary.innerHTML = `
                <h3>Resumen del Juego</h3>
                <p>Total de preguntas: ${totalQuestions}</p>
                <p>Respuestas correctas: ${correctAnswers}</p>
                <p>Respuestas incorrectas: ${wrongAnswers}</p>
                <p>Porcentaje de aciertos: ${((correctAnswers / totalQuestions) * 100).toFixed(2)}%</p>
            `;
            
            // Mostrar historial
            answersHistory.innerHTML = '';
            answerHistory.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = `history-item ${item.isCorrect ? 'correct' : 'incorrect'}`;
                div.innerHTML = `
                    <p><strong>Jugador:</strong> ${item.player}</p>
                    <p><strong>Oración:</strong> ${item.question}</p>
                    <p><strong>Traducción:</strong> ${item.translation}</p>
                    <p><strong>Respuesta seleccionada:</strong> ${item.selected}</p>
                    <p><strong>Respuesta correcta:</strong> ${item.correct}</p>
                    <p><strong>Resultado:</strong> ${item.isCorrect ? 'Correcto' : 'Incorrecto'}</p>
                `;
                answersHistory.appendChild(div);
            });
        }

        function newGame() {
            resultsSection.classList.add('hidden');
            setupSection.classList.remove('hidden');
        }

        // Hacer la función removeStudent disponible globalmente para los botones
        window.removeStudent = removeStudent;
    </script>
